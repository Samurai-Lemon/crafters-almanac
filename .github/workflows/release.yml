# Builds the mod and publishes it as a GitHub Release, which the ALR site's Mods page reads.
#
# Two ways to release:
#   1. Push a tag:  git tag v0.2.0 && git push origin v0.2.0
#   2. Actions tab → Release → Run workflow, and type the version (e.g. 0.2.0)
#
# The jar is named <name>-<version>+fabric-<minecraft>.jar so the site can tell
# which loader and Minecraft version each file is for.
#
# To add a jar by hand instead, open (or create) a release on the Releases page and
# drag the jar in. Name it the same way and the site picks it up like any other.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release, without the v (e.g. 0.2.0)"
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v4

      - name: Work out the version
        id: v
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if [ -n "$INPUT_VERSION" ]; then V="${INPUT_VERSION#v}"; else V="${GITHUB_REF_NAME#v}"; fi
          MC=$(grep '^minecraft_version=' gradle.properties | cut -d= -f2 | tr -d '[:space:]')
          NAME=$(sed -n "s/^[[:space:]]*archivesName[[:space:]]*=[[:space:]]*['\"]\([^'\"]*\)['\"].*/\1/p" build.gradle | head -1)
          echo "version=$V" >> "$GITHUB_OUTPUT"
          echo "mc=$MC" >> "$GITHUB_OUTPUT"
          echo "name=$NAME" >> "$GITHUB_OUTPUT"

      - name: Build
        run: |
          chmod +x gradlew
          ./gradlew build -Pversion="${{ steps.v.outputs.version }}"

      - name: Name the jar
        run: |
          SRC=$(ls build/libs/*.jar | grep -v -e '-sources\.jar$' -e '-dev\.jar$' | head -1)
          mkdir -p out
          cp "$SRC" "out/${{ steps.v.outputs.name }}-${{ steps.v.outputs.version }}+fabric-${{ steps.v.outputs.mc }}.jar"
          ls -l out

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: v${{ steps.v.outputs.version }}
        run: |
          if gh release view "$TAG" > /dev/null 2>&1; then
            gh release upload "$TAG" out/*.jar --clobber
          else
            gh release create "$TAG" out/*.jar --title "$TAG" --generate-notes --target "$GITHUB_SHA"
          fi
